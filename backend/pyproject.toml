[project]
name = "outreach-agent-backend"
version = "0.1.0"
description = "AI-native, evidence-based prospect research and outreach platform (API + workers)"
requires-python = ">=3.12,<3.14"
# Exact pins: this is an application, not a library. Bump deliberately and re-run the full test suite.
dependencies = [
    "fastapi==0.143.3",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
    "email-validator==2.3.0",
    "SQLAlchemy==2.1.5",
    "alembic==1.20.0",
    "psycopg[binary]==3.3.6",
    "redis==8.1.0",
    "structlog==26.1.0",
    "argon2-cffi==25.1.0",
    "cryptography==50.0.2",
    "prometheus-client==0.26.0",
    "httpx==0.28.1",
    "python-multipart==0.0.32",
    "trafilatura==2.3.1",
    "lxml==6.1.3",  # imported directly by app.integrations.web.extract
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.1",
    "mypy==2.4.0",
]

[project.scripts]
outreach = "app.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: requires a reachable PostgreSQL (TEST_DATABASE_URL); skipped otherwise",
]
filterwarnings = [
    "error::DeprecationWarning:app.*",
    # Starlette 1.8 recommends httpx2 for its TestClient; httpx still works. Revisit when httpx2 is stable.
    "ignore:Using .httpx. with .starlette.testclient. is deprecated",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]  # asserts are fine in tests

[tool.ruff.lint.isort]
# The local alembic/ directory would otherwise be mistaken for a first-party package.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S107"]
"alembic/versions/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]

[[tool.mypy.overrides]]
# No type stubs are published for these HTML-processing libraries.
module = ["lxml", "lxml.*", "trafilatura", "trafilatura.*"]
ignore_missing_imports = true
